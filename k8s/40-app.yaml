apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: artifacts, namespace: dialograft }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: dialograft }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      containers:
        - name: api
          image: dialograft:local
          imagePullPolicy: Never
          command: [node, dist/src/api/main.js]
          envFrom: [{ configMapRef: { name: dialograft-config } }, { secretRef: { name: dialograft-secrets } }]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: "1", memory: 512Mi } }
          volumeMounts: [{ name: artifacts, mountPath: /data/artifacts }]
      volumes:
        - { name: artifacts, persistentVolumeClaim: { claimName: artifacts } }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: dialograft }
spec:
  selector: { app: api }
  ports: [{ port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mcp, namespace: dialograft }
spec:
  replicas: 1
  selector: { matchLabels: { app: mcp } }
  template:
    metadata: { labels: { app: mcp } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: mcp
          image: dialograft:local
          imagePullPolicy: Never
          command: [node, dist/src/mcp/main.js]
          envFrom: [{ configMapRef: { name: dialograft-config } }, { secretRef: { name: dialograft-secrets } }]
          ports: [{ containerPort: 8081 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8081 } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: mcp, namespace: dialograft }
spec:
  selector: { app: mcp }
  ports: [{ port: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: dialograft }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: dialograft:local
          imagePullPolicy: Never
          command: [node, dist/src/worker/main.js]
          envFrom: [{ configMapRef: { name: dialograft-config } }, { secretRef: { name: dialograft-secrets } }]
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: "1", memory: 512Mi } }
