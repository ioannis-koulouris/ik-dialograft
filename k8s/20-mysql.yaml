apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mysql-data, namespace: dialograft }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mysql, namespace: dialograft }
spec:
  serviceName: mysql
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - { name: MYSQL_DATABASE, value: dialograft }
            - { name: MYSQL_USER, value: dialograft }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: dialograft-secrets, key: MYSQL_PASSWORD } } }
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: dialograft-secrets, key: MYSQL_ROOT_PASSWORD } } }
          ports: [{ containerPort: 3306 }]
          readinessProbe: { exec: { command: [sh, -c, 'mysqladmin ping -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD"'] }, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: mysql-data } }
---
apiVersion: v1
kind: Service
metadata: { name: mysql, namespace: dialograft }
spec:
  selector: { app: mysql }
  ports: [{ port: 3306 }]
